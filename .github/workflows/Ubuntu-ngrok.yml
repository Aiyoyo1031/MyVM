
name: Ubuntu (ngrok)

on:
  workflow_dispatch:

jobs:
  Instance:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Run Start Script
        shell: bash
        run: source ubuntu-start.sh


      - name: Configure SSH password authentication
        shell: bash
        run: |
          set -euo pipefail

          # Prepare SSH runtime directories
          sudo install -d -m 0755 /run/sshd
          sudo install -d -m 0755 /etc/ssh/sshd_config.d

          # Enable password authentication
          printf '%s\n' \
            'PasswordAuthentication yes' \
            'AuthenticationMethods any' \
            'KbdInteractiveAuthentication no' \
            'PermitEmptyPasswords no' \
            | sudo tee /etc/ssh/sshd_config.d/00-actions-password.conf >/dev/null

          # Validate SSH configuration
          sudo /usr/sbin/sshd -t

          # Start or restart SSH
          sudo systemctl restart ssh
          sudo systemctl is-active --quiet ssh

          # Check effective settings
          SSH_CONFIG="$(sudo /usr/sbin/sshd -T \
            -C user=runner,host=localhost,addr=127.0.0.1)"

          echo "=== Effective SSH authentication ==="
          printf '%s\n' "$SSH_CONFIG" \
            | grep -E '^(passwordauthentication|authenticationmethods) '

          if ! grep -qx 'passwordauthentication yes' <<< "$SSH_CONFIG"; then
            echo "::error::SSH password authentication is disabled"
            exit 1
          fi

          echo "SSH password authentication configured successfully"

      - name: Start SSH via ngrok
        uses: 201821143044/ssh2actions@main
        with:
          mode: ngrok
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_TOKEN }}
          NGROK_REGION: ap
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Run End Script
        shell: bash
        run: source ubuntu-end.sh
